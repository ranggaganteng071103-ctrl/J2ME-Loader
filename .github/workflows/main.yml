name: Build King Kong Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;22.1.7171670"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleOpenDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Loader-APK
          path: app/build/outputs/apk/open/debug/*.apk
          if-no-files-found: error
          retention-days: 7
